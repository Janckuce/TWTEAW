  ww1_poland.1.t:0 "The Polish Question"
  ww1_poland_desc.1:0 "The choice is clear, we must pick a claimant for the Polish throne. The question is, who will we choose? The German candidate, or the Polish candidate? \n\nThe German candidate is a member of the Saxony Household, and is a strong supporter of the German Empire.\n\nThe Polish candidate is a member of the Potocki family, and is a strong supporter of Polish independence. \n\nWe must choose wisely, as our choice will have far-reaching consequences for the future of Poland."
