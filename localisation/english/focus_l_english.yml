# Russia - rework
# Constitutional Monarchy
RUS_Con_Power_through_Constitution:0 "Power through Constitution"
RUS_Con_Power_through_Constitution_desc:0 "To ensure stability and prevent any one person from gaining too much power, we must codify the limits of the monarch's authority in a constitution. This will provide a framework for governance and protect the rights of our citizens."
RUS_Con_Remove_the_Manipulator:0 "Remove the Manipulator"
RUS_Con_Remove_the_Manipulator_desc:0 "With the new constitution in place, it's time to remove the manipulator Rasputin and topple him from power by dismissing him. Permenantly."
RUS_Con_Removal_Of_Corrupt_Autocrats:0 "Removal Of Corrupt Autocrats"
RUS_Con_Removal_Of_Corrupt_Autocrats_desc:0 "The Tsar's court is rife with corruption, with many officials using their positions for personal gain. We must identify and remove these corrupt autocrats to restore integrity and trust in our government."
RUS_Con_Favour_Grand_Duke_Michael:0 "Favour The Grand Duke"
RUS_Con_Favour_Grand_Duke_Michael_desc:0 "With the removal of Rasputin, Nicholas is furious and we should look at Grand Duke Michael as a more favourable Candidate for the Tsardom."
RUS_Con_The_Might_of_the_Duma:0 "The Might of the Duma"
RUS_Con_The_Might_of_the_Duma_desc:0 "With the removal of Rasputin and the replacement of the Tsar and his court, the Duma will be the true power in Russia. We must ensure that it is used for the benefit of all Russians."
RUS_Con_Begin_Stolypin_Reforms:0 "Begin Stolypin's Reforms"
RUS_Con_Begin_Stolypin_Reforms_desc:0 "Pyotr Stolypin's reforms were aimed at modernizing Russia and improving the lives of its citizens. We must continue these reforms to ensure a prosperous future for our nation."
RUS_Con_Begin_Diplomacy_with_Mensheviks:0 "Begin Diplomacy with The Mensheviks"
RUS_Con_Begin_Diplomacy_with_Mensheviks_desc:0 "Now that the government is more stable, we can begin to reach out to the Mensheviks and other Constitutional groups to find common ground and work towards a peaceful resolution."
RUS_Con_Give_Concessions_to_Axelrod:0 "Give Concessions to Axelrod and his Party"
RUS_Con_Give_Concessions_to_Axelrod_desc:0 "To ensure the support of the Mensheviks, we must give concessions to Axelrod and his party. This may include land reforms, worker rights, and other policies that align with their goals."
RUS_Con_Finalize_The_Agreement:0 "Finalize The Agreement"
RUS_Con_Finalize_The_Agreement_desc:0 "With concessions made, we can finalize the agreement with the Mensheviks and other Constitutional groups. This will ensure a peaceful and a stable government for Russia."
RUS_Con_Overshadow_Stolypin:0 "Overshadow Stolypin's Reforms"
RUS_Con_Overshadow_Stolypin_desc:0 "While Stolypin's reforms were a step in the right direction. The Menshevik's policies and initiatives take precedence; by overshadowing Stolypin's reforms, we can establish our own vision for Russia's future."
RUS_Con_Introduce_Cooperative_Initiatives:0 "Introduce Cooperative Initiatives"
RUS_Con_Introduce_Cooperative_Initiatives_desc:0 "To further our goals of social and economic reform, we must introduce cooperative initiatives that empower workers and peasants. This will help to create a more equitable society and promote economic growth."
RUS_Con_Reduce_former_Serfs_Debt:0 "Reduce Former Serfs' Debt"
RUS_Con_Reduce_former_Serfs_Debt_desc:0 "Many former serfs are burdened with debt from their previous status. We must take steps to reduce this debt and provide them with the resources they need to succeed in a free society."
RUS_Con_Limit_Their_Influence:0 "Limit The Influence of The Mensheviks Lords"
RUS_Con_Limit_Their_Influence_desc:0 "The Mensheviks' influence must be limited to ensure that the Duma remains the true power in Russia. We must prevent them from undermining the reforms and policies we have implemented."
RUS_Con_End_of_The_Infighting:0 "End of The Infighting"
RUS_Con_End_of_The_Infighting_desc:0 "Having Picked a side in the Duma, it's time to end the infighting and work towards a common goal. We must put aside our differences and work together to build a better future for Russia."
RUS_Con_Catching_Up_With_Western_Technology:0 "Catching Up With Western Technology"
RUS_Con_Catching_Up_With_Western_Technology_desc:0 "To ensure Russia's continued growth and development, we must catch up with Western technology and industrialization."
RUS_Con_Give_Research_Grants:0 "Give Research Grants to Universities"
RUS_Con_Give_Research_Grants_desc:0 "To promote innovation and technological advancement, we must provide research grants to universities and institutions. This will help to foster a culture of innovation and ensure that Russia remains competitive on the global stage."
RUS_Con_Power_of_Russian_Science:0 "The Power of Russian Science"
RUS_Con_Power_of_Russian_Science_desc:0 "Russian scientists and researchers have made significant contributions to the field of science. We must harness this power and invest in scientific research to drive innovation and progress."


# Democracy

# Socialism - SRs
RUS_focus_SR_Continue_Stolypins_Reforms:0 "Continue with Stolypin's Reforms"
RUS_focus_SR_Continue_Stolypins_Reforms_desc:0 "We may not have agreed with the reforms of Pyotr Stolypin originally, but they have shown promise. Continuing with them on our terms, or even better, our own version, ought to be just as, if not even more successful."
RUS_focus_SR_Land_and_Freedom:0 "Land and Freedom"
RUS_focus_SR_Land_and_Freedom_desc:0 "Land and Freedom, that's our program in a nutshell. By socializing, rather than privatizing or nationalizing, the land, the peasants will be much happier with our rule, and will allow us to transition from primitive subsistence farming to more modern organization."
RUS_focus_SR_Allow_Cooperatives:0 "Allow Co-operatives"
RUS_focus_SR_Allow_Cooperatives_desc:0 "Now that our peasants have land and can read, they want to freely associate. Let them! Co-operatives can be treated the same as any other legal enterprise, and if this raises food production, more people will be able to work in our factories too!"
RUS_focus_SR_Crack_Down_on_Feudalists:0 "Crack Down on Feudalists"
RUS_focus_SR_Crack_Down_on_Feudalists_desc:0 "Of course the old imperial feudalists hate no longer being the only ones owning land. We can have Savinkov arrange \"accidents\" for some, while lawfully sentencing others. Under pressure from both sides, they will fold."
RUS_focus_SR_Steel_Production:0 "Steel Production in the Urals"
RUS_focus_SR_Steel_Production_desc:0 "The Urals have long been the site of large iron mines. With people having moved East prior, their size and number should be expanded. Jobs for the people, steel for the arms factories. It's a win-win!"
RUS_focus_SR_Rubber_Production:0 "Rubber Production in the Caucasus"
RUS_focus_SR_Rubber_Production_desc:0 "Our Western experts, and increasingly our own engineers, have been talking about these carriages that supposedly don't need a horse. Apparently that smelly liquid flowing out of the ground in Azerbaijan is what they run on. Their wheels are a peculiar thing though - made of metal and with some firm but malleable substance on the outside. Apparently it comes from trees that can be planted in the Southeastern parts of our empire. Can't hurt to have some of those, right?"
RUS_focus_SR_Peasants_Land_Bank:0 "Found the Peasants' Land Bank"
RUS_focus_SR_Peasants_Land_Bank_desc:0 "Our peasants, united in political freedom and land ownership, have been trying to expand their farms and co-operatives, but have found little support in our major financial institutions. Founding a bank catering to their needs will at long last remove the last hurdle to their financial freedom."
RUS_focus_SR_Efficient_Land_Use:0 "Efficient Land Use"
RUS_focus_SR_Efficient_Land_Use_desc:0 "With our peasants fully emancipated and industrialization well underway, it's time to set efficiency standards on land use. If a factory can produce more while taking up less land, it ought to be given priority."
RUS_focus_SR_Invite_Foreign_Experts:0 "Invite Foreign Experts"
RUS_focus_SR_Invite_Foreign_Experts_desc:0 "Our finest minds, as fine as they are, simply haven't been able to catch up to Western developments due to not only a lack of funding, but also learning opportunities. If we are to improve, they need a crash course in modern technology, and it's best we bring it to them."
RUS_focus_SR_Rural_Investments:0 "Rural Investments"
RUS_focus_SR_Rural_Investments_desc:0 "Having run on an agrarian platform, it follows that we ought to improve the lives of our citizens outside of cities first and foremost. A rural investment program must start as soon as possible."
RUS_focus_SR_Train_Skilled_Workers:0 "Train Skilled Workers"
RUS_focus_SR_Train_Skilled_Workers_desc:0 "With foreign experts teaching ours and the lives of our people improving, it's time that knowledge gets passed on. More people have more sense and can come up with more, and most importantly better, solutions. Training our own cadres of skilled workers is a high priority, lest foreign powers hold an advantage over us."
RUS_focus_SR_Improve_Worker_Conditions:0 "Improve Worker Conditions"
RUS_focus_SR_Improve_Worker_Conditions_desc:0 "Machines, land, buildings and accumulated knowledge are great, but people use all of those. The life of a peasant or factory worker isn't easy. If we can improve their lives, our people will be grateful."
RUS_focus_SR_Ensure_Basic_Literacy:0 "Ensure Basic Literacy"
RUS_focus_SR_Ensure_Basic_Literacy_desc:0 "Many of our people cannot even read. This was fine for noble lords keeping serfs, but industrial workers, doctors and generally everyone in modern society must be able to read to be able to do their job. We must teach our people how to read, yesterday."
RUS_focus_SR_Democratize_General_Education:0 "Democratize General Education"
RUS_focus_SR_Democratize_General_Education_desc:0 "Basic literacy is one thing, but engineers and scientists need more than that. Only God knows how many brilliant minds in our past never had the chance to develop for lack of education. No more! Even if it has to be in evenings or on weekends, we will give everyone a chance to acquire knowledge, for knowledge is power. The more knowledgeable the people, the more powerful the country."
RUS_focus_SR_Set_Educational_Standards:0 "Set Educational Standards"
RUS_focus_SR_Set_Educational_Standards_desc:0 "Our education efforts have had one major flaw - lack of standardization. Three years of schooling in Moscow can be worth six in Tambov. This cannot continue, or navigating the education system will become impossible! Standardized curricula and testing are the way to go."
RUS_focus_SR_Promote_Higher_Education:0 "Promote Higher Education"
RUS_focus_SR_Promote_Higher_Education_desc:0 "With a handful of years in school, finally everyone can do most jobs. Still, a lack of knowledge in foreign languages and science is an obstacle. Applying the same principle as with skilled labor to higher education will be a good start."
RUS_focus_SR_Invite_Back_Emigres:0 "Invite back Émigrés"
RUS_focus_SR_Invite_Back_Emigres_desc:0 "Many of our Socialist Revolutionary comrades have been forced to flee persecution abroad. In order to garner popular support, they must be brought back. When people see and hear familiar names, they will know what's going on."
RUS_focus_SR_Utilize_Savinkovs_Experience:0 "Utilize Savinkov's Experience"
RUS_focus_SR_Utilize_Savinkovs_Experience_desc:0 "Boris Savinkov, who's done many tings for the movement before the Azef affair, should be put to work in the service of our regime. An \"accident\" here and a couple gunshots there can be more effective than any pogrom or mass execution, and Savinkov is the man for the job of organizing this."
RUS_focus_SR_Leniency_for_Revolutionaries:0 "Leniency for Revolutionaries"
RUS_focus_SR_Leniency_for_Revolutionaries_desc:0 "The previous regime sentenced many of our comrades, denouncing them as terrorists. Technically not wrong, but their intent must be considered. We ought to reward our people for their efforts and sacrifice. On the other hand we can't simply let them go, that'd be too obvious. However, by pronouncing some of the harsher sentences unfair and revising them, we can make some of our more radical supporters happier without antagonizing the public at large too much."
RUS_focus_SR_Revive_the_SRCO:0 "Revive the SRCO"
RUS_focus_SR_Revive_the_SRCO_desc:0 "The Socialist-Revolutionary Combat Organization, effectively defunct since the Azef affair despite Boris Savinkov's efforts, used to be an important arm of the movement. With empires to our West rattling their sabres, resurrecting it could prove useful. Teaching people how to resist a hostile regime will be a boon should our armies not fare well on the battlefield."
RUS_focus_SR_Secure_the_Regime:0 "Secure the Regime"
RUS_focus_SR_Secure_the_Regime_desc:0 "With many important reforms done, our people becoming wealthier and happier, our regime isn't doing badly. Still, some subversive elements, be they democrats, monarchists or others, rear their heads every now and again. It's time to make deals with those who are willing, and get rid of those who aren't."
RUS_focus_SR_Propaganda_of_Our_Own:0 "Propaganda of Our Own"
RUS_focus_SR_Propaganda_of_Our_Own_desc:0 "The Bolsheviks aren't the only ones who can make propaganda! Indeed, if we couldn't, nobody would have ever voted for us. Let us spin up our propaganda presses, now official, to show the people not only how much good we've done for them, but how much more we will, too."
RUS_focus_SR_Preempt_Bolshevik_Coup:0 "Deal with the Bolsheviks"
RUS_focus_SR_Preempt_Bolshevik_Coup_desc:0 "The Bolsheviks have become quite the thorn in our side recently. Ex-Okhranka personnel and others under Savinkov's lead have identified the main nests where those pesky Bolsheviks are hiding. Flushing them out will effectively solve the problem, bar some sort of national catastrophe."
RUS_focus_SR_Support_the_Oborontsy:0 "Support the Oborontsy"
RUS_focus_SR_Support_the_Oborontsy_desc:0 "Since the war started, we have seen some members of the opposition declare that the defense of the country is paramount. Naturally, their own parties tend to shout them down, wanting to capitalize on anything, within or outside our and their control, to try and assume power. If we declare our support for these defensists, and back those words up with some action, we could get a boost in recruitment."
RUS_focus_SR_Moscow_Development:0 "Seat of the old Tsars"
RUS_focus_SR_Moscow_Development_desc:0 "Moscow, where the first Tsars ruled, has suffered some neglect since Petrograd became the capital. Rejuvenating the city will not only make it a less vulnerable alternative should the Teutons come knocking again, a country as large as Russia cannot be effectively ruled from a single place and having a well developed regional seat of power will be a boon to the whole area."
RUS_focus_SR_Tsaritsyn_Development:0 "The City named for Tsars"
RUS_focus_SR_Tsaritsyn_Development_desc:0 "On the Southern Volga, Tsaritsyn has been slowly expanding. The river provides a convenient way to transport all kinds of cargo to and from the city, perfect for a country with a transport network as underdeveloped as ours. Funding further expansion of the city will come at little cost in transport, but with boons just as great as anywhere else."
RUS_focus_SR_Minsk_Development:0 "The City Built in a Forest"
RUS_focus_SR_Minsk_Development_desc:0 "The capital of White Ruthenia hasn't had much of a chance so far, but it shouldn't need much to rival the other great cities."
RUS_focus_SR_Kiev_Development:0 "Kiev Industrial Area"
RUS_focus_SR_Kiev_Development_desc:0 "The Ukraine, the breadbasket of the empire, must not be neglected. With land reforms now done, its agricultural origins can pave the way for it to become another industrial powerhouse of the country."
RUS_focus_SR_Develop_Omsk:0 "Siberia Development - Omsk"
RUS_focus_SR_Develop_Omsk_desc:0 "Thousands upon thousands of people left for Siberia as part of Stolypin's reforms. Siberia however remains largely rural, which is a shame, as its location past the Urals makes it easily defensible. Plus of course our agrarian ideology won't let us not support the region. Omsk, relatively close, seems like the perfect place to start."
RUS_focus_SR_Develop_Novonikolayevsk:0 "Siberia Development - Novonikolayevsk"
RUS_focus_SR_Develop_Novonikolayevsk_desc:0 "Developing Omsk has been a success and the city now abounds with new enterprises, some run co-operatively. It can therefore be used as a stepping stone to further greatness. Another place that seems good is Novonikolayevsk, with nearby Barnaul a miniature Ukraine."
RUS_focus_SR_Develop_Chita:0 "Siberia Development - Chita"
RUS_focus_SR_Develop_Chita_desc:0 "Eastern Siberia still remains largely unexplored. The inhospitability of the region could be overcome, but that would need a solid base of operations. With the Trans-Siberian railway operational and Omsk and Novonikolayevsk great successes, Chita, also fairly southern, would make for a solid bastion against the wilderness on the far side of Lake Baikal."
RUS_focus_SR_Remember_the_Navy:0 "Remember the Navy's Needs"
RUS_focus_SR_Remember_the_Navy_desc:0 "The Russian Imperial Navy... Some say the less said about it the better, but the fact remains that without properfacilities, a modern navy simply cannot exist. The Baltic and Black seas are crucial, but some funds can be earmarked for the Pacific too."
RUS_focus_SR_Expand_Tula_Arms_Plant:0 "Expand the Tula Arms Plant"
RUS_focus_SR_Expand_Tula_Arms_Plant_desc:0 "The Tula Arms Plant, supplier of a large number of rifles for our army, is in need of modernization. With other powers' armies expanding by the day, it is more than desirable to expand the plant so it can cover our military's needs better."
RUS_focus_SR_More_Funds_for_Obukhov:0 "More Funds for Obukhov"
RUS_focus_SR_More_Funds_for_Obukhov_desc:0 "One does not simply win a modern war without artillery. The Obukhov plant in St. Petersburg, long a supplier of cannons, can be relied on. Supporting it would see us catch up to the other great powers not just in quantity, but also in quality."
RUS_focus_SR_Special_Research_Facilities:0 "Special Research Facilities"
RUS_focus_SR_Special_Research_Facilities_desc:0 "Sappers, field telephones, reconnaissance, those are just a few things a modern army contains outside of the main infantry, cavalry and artillery formations. Knowing more faster, and being able to bypass or disable enemy defenses with less effort will surely bring us victory!"
RUS_focus_SR_State_of_the_Military:0 "State of the Military"
RUS_focus_SR_State_of_the_Military_desc:0 "Now that we've taken over, we must re-assess our military strength and correct any mistakes the various corrupt cronies of the Imperial family have made."
RUS_focus_SR_Infantry:0 "Infantry, Queen of All Arms"
RUS_focus_SR_Infantry_desc:0 "Whatever may be happening, the infantry remaining the main force of any modern army. We must therefore make it a priority."
RUS_focus_SR_Logistics:0 "Improve our Logistical System"
RUS_focus_SR_Logistics_desc:0 "The days when armies could live off the land are long over. We need to update our supply systems to reflect this."
RUS_focus_SR_Literate_NCOs:0 "Literate NCOs"
RUS_focus_SR_Literate_NCOs_desc:0 "Now that we've ensured access to basic education for everyone, it's inexcusable that the men who lead our troops in battle would be illiterate. Requiring even NCOs to be literate will make order issuing easier, execution faster and more correct, and enable our NCOs to lift the spirits of their men."
RUS_focus_SR_Quick_Training:0 "Quick training"
RUS_focus_SR_Quick_Training_desc:0 "There's a saying that goes \"There's a lot of us\" in Russia. That is certainly true, and our army can capitalize on this. Why bother training troops for months when a significant portion won't even survive their first major battle? It makes more sense to give them a minimum and let them learn more, if any is even required, once they get to their units."
RUS_focus_SR_Thorough_Training:0 "Thorough Training"
RUS_focus_SR_Thorough_Training_desc:0 "War is already an absolutely senseless waste of human life and there's no good reason to make it worse by treating our people as simple cannon fodder. Proper training they can be reminded of could save many lives."
RUS_focus_SR_Uniforms:0 "Finish the Switch to New Uniforms"
RUS_focus_SR_Uniforms_desc:0 "Vladimir Sukhomlinov, the Tsar's last minister of war, did have one inarguably good idea - give our troops uniforms that stand out less. It's taken some time, but we can finally complete the switch to these new uniforms that even the Tsar himself approved of, giving our troops better odds of survival."
RUS_focus_SR_Cossacks:0 "Cossack Charges"
RUS_focus_SR_Cossacks_desc:0 "The Cossacks have been an integral part of the Imperial Army for hundreds of years, and it would be foolish to throw away their skills. By instead modernizing their equipment, we can make them capable of performing well even on the modern battlefield."
RUS_focus_SR_Artillery:0 "Artillery, King of Battle"
RUS_focus_SR_Artillery_desc:0 "Be it sieges or battlefield support, no modern army can do without artillery. Improving the ways in which we use artillery and letting it come into its own will make it into the King of Battle."
RUS_focus_SR_Issue_Helmets:0 "Issue Helmets"
RUS_focus_SR_Issue_Helmets_desc:0 "Our allies in the Entente Cordiale have been issuing helmets to their troops to provide protection from enemy artillery and unfortunate accidents, and have noticed a marked decrease in the severity and fatality of head wounds. We ought to do the same."
RUS_focus_SR_Leadership_Academies:0 "Leadership Academies"
RUS_focus_SR_Leadership_Academies_desc:0 "Both our allies and foes have established academies for their officers to learn how to lead. With the latter now rattling their sabres, it's imperative we bring our leadership up to modern standards."
RUS_focus_SR_A_Modern_And_Peoples_Army:0 "A Modern People's Army"
RUS_focus_SR_A_Modern_And_Peoples_Army_desc:0 "Our army reforms have borne fruit. Foreign powers respect our military almost as much as their own, and indeed it has become one we can be proud of. One change remains to be done - open up promotions to anyone, regardless of social status, and in honor of this, rename it to the Russian People's Army, for it is them it's meant to defend."
RUS_focus_SR_Sikorsky:0 "Fund Sikorsky"
RUS_focus_SR_Sikorsky_desc:0 "Our efforts to catch up with the other powers in aviation have been plagued with lack of domestic talent and/or funds. Now there seems to be a guiding light. Igor Sikorsky, who's been experimenting with aircraft design for a couple years now, seems to be just the engineering talent we needed."
RUS_focus_SR_Westernized_Air_Force:0 "Westernized Air Force"
RUS_focus_SR_Westernized_Air_Force_desc:0 "While Sikorsky's work continues, so does our military's. New knowledge must be brought in from the West, not only on how to build planes, but also on how to use them. Combined with our own experiments in aviation tactics, this should make our nascent air force a match for any other."
RUS_focus_SR_New_Ship_Designs:0 "New Ship Designs"
RUS_focus_SR_New_Ship_Designs_desc:0 "The naval arms race between Germany and Britain has led to some peculiar designs. It would be wise to study them and acquire new knowledge, helping our designers and shipbuilders do their job for the country."
RUS_focus_SR_Learn_from_Tsushima:0 "Learn from Tsushima"
RUS_focus_SR_Learn_from_Tsushima_desc:0 "Our defeat at Tsushima has severely demoralized the remnants of our Navy, not to mention that a significant part of it was destroyed there. With a lot of old ships sunk there, we can use it as a learning exercise to prepare our rebuilding Navy for the future."

