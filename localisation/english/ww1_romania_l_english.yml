#Events
 ww1_romania.1.t:0 "Death Of The Romanian King"
 ww1_romania_desc.1:0 "The Romanian Government Solemnly Reports That This Morning His Majesty, The King Of All Romanians - King Carol I Has Passed Away Peacefully In His Sleep. The Question Of Who Will Inherit The Throne Remains In The Air As A Temporary Regent Is Put In Power To Maintain Stability And Order Over The Nation."
 ww1_romania.1.a:0 "Not Cool, Dude"
 ww1_romania.2.t:0 "Plans To Reform The Romanian Military"
 ww1_romania_desc.2:0 "The Romanian Army, Despite Being One Of The Powerful And Most Numerous In The Balkan Region, Has In Recent Times Been Far Less Competent Than Desirable - Especially When Compared To Our Neighbours Military Capabilities. The Next Logical Step Is To Make A Proper Effort To Reform The Army, The Current Choice On Whose Steps We Will Follow In Is Yet To Be Decided."
 ww1_romania.2.a:0 "French Reforms"
 ww1_romania.2.b:0 "British Reforms"
 ww1_romania.2.c:0 "Russian Reforms"
 ww1_romania.3.t:0 "The Crowning Ceremony"
 ww1_romania_desc.3:0 "Following The Death Of The Romanian King - Carol I, The Crowning Ceremony Will Take Place Today And The Next Ruler Will Be Declared Promptly."
 ww1_romania.3.a:0 "Ferdinand I"
 ww1_romania.3.b:0 "William"
 ww1_romania.3.c:0 "Maria"
